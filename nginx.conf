events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # -----------------------------------------------------------------
        # 1. Root Home Page (apps.my.org/)
        # -----------------------------------------------------------------
        location = / {
            root /var/www/html;
            index index.html;
        }

        # -----------------------------------------------------------------
        # 2. App 1 (apps.my.org/app1) -> http://localhost:8080
        # -----------------------------------------------------------------
        location /sota2026/ {
            proxy_pass http://localhost:8080/;
            proxy_http_version 1.1;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (uncomment if your apps use WebSockets)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # -----------------------------------------------------------------
        # 3. App 2 (apps.my.org/app2) -> http://localhost:8081
        # -----------------------------------------------------------------
        # location /app2/ {
        #     proxy_pass http://localhost:8081/;
        #     proxy_http_version 1.1;
        #
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # Add more location blocks here for additional apps...
    }
}
